{% extends "base.html" %}
{% block title %}{% if book %}编辑图书{% else %}添加图书{% endif %} - 图书管理系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="bi bi-{% if book %}pencil{% else %}plus-circle{% endif %}"></i>
                    {% if book %}编辑图书{% else %}添加图书{% endif %}
                </h5>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label for="title" class="form-label">书名 <span class="text-danger">*</span></label>
                        <input type="text" id="title" name="title" class="form-control" required
                               value="{{ book.title if book else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="author" class="form-label">作者 <span class="text-danger">*</span></label>
                        <input type="text" id="author" name="author" class="form-control" required
                               value="{{ book.author if book else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="isbn" class="form-label">ISBN <span class="text-danger">*</span></label>
                        <input type="text" id="isbn" name="isbn" class="form-control" required
                               value="{{ book.isbn if book else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="publisher" class="form-label">出版社</label>
                        <input type="text" id="publisher" name="publisher" class="form-control"
                               value="{{ book.publisher if book else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="category" class="form-label">分类</label>
                        <input type="text" id="category" name="category" class="form-control"
                               placeholder="如：文学、计算机、科幻..."
                               value="{{ book.category if book else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="total_quantity" class="form-label">总数量</label>
                        <input type="number" id="total_quantity" name="total_quantity" class="form-control"
                               min="1" value="{{ book.total_quantity if book else 1 }}">
                        {% if book %}
                        <div class="form-text">当前借出：{{ book.total_quantity - book.available_quantity }} 本</div>
                        {% endif %}
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <a href="{{ url_for('book_list') }}" class="btn btn-outline-secondary">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
