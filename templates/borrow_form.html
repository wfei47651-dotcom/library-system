{% extends "base.html" %}
{% block title %}借阅图书 - 图书管理系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-plus-circle"></i> 借阅图书</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label for="book_id" class="form-label">选择图书 <span class="text-danger">*</span></label>
                        <select id="book_id" name="book_id" class="form-select" required>
                            <option value="">-- 请选择图书 --</option>
                            {% for book in books %}
                            <option value="{{ book.id }}">
                                《{{ book.title }}》 - {{ book.author }} (可借: {{ book.available_quantity }}/{{ book.total_quantity }})
                            </option>
                            {% endfor %}
                        </select>
                        {% if not books %}
                        <div class="form-text text-danger">没有可借阅的图书</div>
                        {% endif %}
                    </div>
                    <div class="mb-3">
                        <label for="reader_id" class="form-label">选择读者 <span class="text-danger">*</span></label>
                        <select id="reader_id" name="reader_id" class="form-select" required>
                            <option value="">-- 请选择读者 --</option>
                            {% for reader in readers %}
                            <option value="{{ reader.id }}">{{ reader.name }} ({{ reader.phone or '无电话' }})</option>
                            {% endfor %}
                        </select>
                        {% if not readers %}
                        <div class="form-text text-danger">没有可用的读者</div>
                        {% endif %}
                    </div>
                    <div class="mb-3">
                        <label for="due_days" class="form-label">借阅天数</label>
                        <input type="number" id="due_days" name="due_days" class="form-control"
                               min="1" max="90" value="30">
                        <div class="form-text">默认借阅期限为30天</div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary" {% if not books or not readers %}disabled{% endif %}>确认借阅</button>
                        <a href="{{ url_for('borrow_list') }}" class="btn btn-outline-secondary">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
