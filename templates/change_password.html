{% extends "base.html" %}
{% block title %}修改密码 - 图书管理系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-key"></i> 修改密码</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label for="old_password" class="form-label">原密码</label>
                        <input type="password" id="old_password" name="old_password" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">新密码</label>
                        <input type="password" id="new_password" name="new_password" class="form-control" required minlength="4">
                        <div class="form-text">密码至少4位</div>
                    </div>
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label">确认新密码</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-control" required minlength="4">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">修改密码</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
